<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Muscle Viewer — lifestats</title>
<style>
  :root {
    --bg: #0d0f13;
    --panel: #16191f;
    --panel-border: #262b34;
    --text: #e8eaed;
    --text-dim: #8b93a1;
    --accent: #ff5a3c;
    --accent-dim: #7a3226;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(10px, env(safe-area-inset-top)) 12px 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    background: linear-gradient(to bottom, rgba(13,15,19,0.92), rgba(13,15,19,0));
    pointer-events: none;
    z-index: 10;
  }
  #topbar h1 {
    font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.2px;
    pointer-events: auto;
  }
  #topbar .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  #viewToggle {
    display: flex; gap: 4px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 3px;
  }
  #viewToggle button {
    border: none; background: transparent; color: var(--text-dim);
    font-size: 12px; padding: 6px 10px; border-radius: 8px; font-weight: 600;
  }
  #viewToggle button.active { background: var(--accent); color: #fff; }

  #categoryBar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 10px max(10px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; overflow-x: auto;
    background: linear-gradient(to top, rgba(13,15,19,0.96), rgba(13,15,19,0));
    z-index: 10;
    -webkit-overflow-scrolling: touch;
  }
  #categoryBar::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex: 0 0 auto;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .cat-btn .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }

  #infoPanel {
    position: fixed;
    right: 10px;
    top: 64px;
    max-width: 220px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px 14px;
    z-index: 10;
    transform: translateX(260px);
    transition: transform 0.25s ease;
  }
  #infoPanel.show { transform: translateX(0); }
  #infoPanel .name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  #infoPanel .cat { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  #infoPanel .desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; }

  #hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: var(--text-dim); font-size: 13px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 0.4s;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 100; font-size: 14px; color: var(--text-dim);
  }
</style>
</head>
<body>

<div id="loading">Loading model…</div>

<div id="canvas-wrap"></div>

<div id="topbar">
  <div>
    <h1>Muscle Viewer</h1>
    <div class="sub">Rotate · Pinch to zoom · Drag to pan</div>
  </div>
  <div id="viewToggle">
    <button data-view="front" class="active">Front</button>
    <button data-view="back">Back</button>
  </div>
</div>

<div id="infoPanel">
  <div class="cat" id="infoCat">Category</div>
  <div class="name" id="infoName">Muscle</div>
  <div class="desc" id="infoDesc">Tap a muscle to see details.</div>
</div>

<div id="categoryBar"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- Category definitions ----------
const CATEGORIES = {
  all:   { label: 'All',         color: '#8b93a1' },
  upper: { label: 'Upper Body',  color: '#4fb3ff' },
  core:  { label: 'Core',        color: '#ffd23f' },
  lower: { label: 'Lower Body',  color: '#3ddc84' },
};

const MUSCLE_INFO = {
  chest:              { name: 'Chest',               cat: 'upper', desc: 'Pectoralis major/minor. Worked by presses, flys, push-ups.' },
  lats:               { name: 'Back — Lats',         cat: 'upper', desc: 'Latissimus dorsi. Worked by pull-ups, rows, pulldowns.' },
  traps:              { name: 'Back — Traps',        cat: 'upper', desc: 'Trapezius. Worked by shrugs, upright rows, deadlifts.' },
  rhomboids:          { name: 'Back — Rhomboids',    cat: 'upper', desc: 'Rhomboid major/minor. Worked by rows, band pull-aparts.' },
  shoulders:          { name: 'Shoulders',           cat: 'upper', desc: 'Deltoids — front, side, and rear heads. Worked by presses, lateral/rear raises.' },
  bicepsLongHead:     { name: 'Biceps — Long Head',  cat: 'upper', desc: 'Outer bicep head. Worked by incline curls, wide-grip curls.' },
  bicepsShortHead:    { name: 'Biceps — Short Head', cat: 'upper', desc: 'Inner bicep head. Worked by preacher curls, close-grip curls.' },
  bicepsBrachialis:   { name: 'Brachialis',          cat: 'upper', desc: 'Sits under the biceps. Worked by hammer curls, reverse curls.' },
  tricepsLongHead:    { name: 'Triceps — Long Head', cat: 'upper', desc: 'Largest tricep head, crosses the shoulder. Worked by overhead extensions.' },
  tricepsLateralHead: { name: 'Triceps — Lateral Head', cat: 'upper', desc: 'Outer tricep head. Worked by pushdowns, close-grip presses.' },
  tricepsMedialHead:  { name: 'Triceps — Medial Head', cat: 'upper', desc: 'Deep inner tricep head. Worked by pushdowns, kickbacks.' },
  forearms:           { name: 'Forearms',            cat: 'upper', desc: 'Forearm flexors/extensors. Worked by grip work, curls.' },
  abs:                { name: 'Abs',                 cat: 'core',  desc: 'Rectus abdominis. Worked by crunches, leg raises.' },
  obliques:           { name: 'Obliques',             cat: 'core',  desc: 'Internal/external obliques. Worked by twists, side planks.' },
  lowerback:          { name: 'Lower Back',           cat: 'core',  desc: 'Erector spinae. Worked by deadlifts, back extensions, good mornings.' },
  glutes:             { name: 'Glutes',               cat: 'lower', desc: 'Gluteus maximus. Worked by squats, hip thrusts, lunges.' },
  quads:              { name: 'Quads',                cat: 'lower', desc: 'Quadriceps. Worked by squats, leg press, lunges.' },
  hamstrings:         { name: 'Hamstrings',           cat: 'lower', desc: 'Hamstrings. Worked by deadlifts, leg curls, RDLs.' },
  calves:             { name: 'Calves',               cat: 'lower', desc: 'Gastrocnemius/soleus. Worked by calf raises.' },
  hipAbductors:       { name: 'Hip Abductors/Adductors', cat: 'lower', desc: 'Gluteus medius (outer hip) and adductors (inner thigh). Worked by lateral lunges, cable/machine hip abduction & adduction.' },
};

// ---------- Renderer / scene / camera ----------
const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f13);
scene.fog = new THREE.Fog(0x0d0f13, 6, 14);

function viewportSize() {
  const w = wrap.clientWidth || window.innerWidth || 1;
  const h = wrap.clientHeight || window.innerHeight || 1;
  return [w, h];
}
let [vw, vh] = viewportSize();

const camera = new THREE.PerspectiveCamera(40, vw / vh, 0.1, 100);
camera.position.set(0, 1.15, 3.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(vw, vh);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

function resizeToViewport() {
  const [w, h] = viewportSize();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
// Some environments report a 0x0 or stale viewport at initial script
// execution (before the first layout pass completes) — a few follow-up
// resize passes catch the real size once layout settles.
requestAnimationFrame(resizeToViewport);
setTimeout(resizeToViewport, 50);
setTimeout(resizeToViewport, 300);
new ResizeObserver(resizeToViewport).observe(wrap);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.6;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.92;
controls.minPolarAngle = Math.PI * 0.08;
controls.update();

// Lights
scene.add(new THREE.HemisphereLight(0xfff2e6, 0x1a1410, 0.65));
const key = new THREE.DirectionalLight(0xfff4e8, 1.4);
key.position.set(2.5, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 3;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fc2ff, 0.65);
rim.position.set(-3, 2, -3);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.35);
fill.position.set(-2, 1, 3);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 48),
  new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Body construction ----------
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);

const skinMat = new THREE.MeshStandardMaterial({
  color: 0x3a3f4a, roughness: 0.9, metalness: 0.0,
  transparent: true, opacity: 0.35, depthWrite: true,
});

function capsule(radiusTop, radiusBottom, height, radialSeg = 20) {
  // Approximate a tapered capsule using a lathe-free approach: use CapsuleGeometry when radii equal,
  // else a cylinder with rounded ends approximated by scaling spheres — kept simple: use CapsuleGeometry avg radius.
  const r = (radiusTop + radiusBottom) / 2;
  return new THREE.CapsuleGeometry(r, height, 12, radialSeg);
}

// Base "skin" silhouette (subtle, for context under the muscles)
function addSkinPart(geo, pos, rot = [0,0,0]) {
  const m = new THREE.Mesh(geo, skinMat);
  m.position.set(...pos);
  m.rotation.set(...rot);
  m.castShadow = false;
  m.receiveShadow = false;
  bodyGroup.add(m);
  return m;
}

// Head
addSkinPart(new THREE.SphereGeometry(0.15, 28, 28), [0, 1.68, 0]);
// Neck
addSkinPart(new THREE.CylinderGeometry(0.06, 0.07, 0.08, 20), [0, 1.535, 0]);
// Torso core (skin)
addSkinPart(capsule(0.16, 0.13, 0.32), [0, 1.28, 0]);
// Pelvis
addSkinPart(new THREE.SphereGeometry(0.15, 24, 24, 0, Math.PI * 2, 0, Math.PI / 1.6), [0, 0.92, 0], [Math.PI, 0, 0]);

[-1, 1].forEach(side => {
  // Upper arm skin
  addSkinPart(capsule(0.05, 0.045, 0.24), [0.30 * side, 1.30, 0], [0, 0, side * 0.12]);
  // Forearm skin
  addSkinPart(capsule(0.042, 0.035, 0.22), [0.335 * side, 1.00, 0.02], [0.15, 0, side * 0.1]);
  // Hand
  addSkinPart(new THREE.SphereGeometry(0.045, 10, 10), [0.35 * side, 0.83, 0.04]);
  // Thigh skin
  addSkinPart(capsule(0.085, 0.07, 0.32), [0.11 * side, 0.62, 0.01]);
  // Shin skin
  addSkinPart(capsule(0.055, 0.045, 0.32), [0.11 * side, 0.24, 0.02]);
  // Foot
  addSkinPart(new THREE.BoxGeometry(0.09, 0.05, 0.2), [0.11 * side, 0.03, 0.06]);
});

// ---------- Muscle meshes ----------
// Glossy, softly-shaded physical material — smooth clearcoat + grazing-angle
// sheen stands in for the fresnel/rim lighting used in anatomical illustrations,
// instead of a flat-shaded low-poly look.
const muscles = []; // { mesh, id, baseColor }
const highlightMat = (hex) => new THREE.MeshPhysicalMaterial({
  color: hex,
  roughness: 0.42,
  metalness: 0.0,
  clearcoat: 0.55,
  clearcoatRoughness: 0.28,
  sheen: 1,
  sheenRoughness: 0.5,
  sheenColor: new THREE.Color(0xfff2e0),
  side: THREE.DoubleSide,
});

// A tapering "muscle belly" — thin tendon-like ends with a fuller bulge
// somewhere along its length — built by revolving a radius profile around
// the local Y axis. Used in place of uniform capsules for limb muscles so
// they read as belly-into-tendon shapes rather than tubes.
function muscleBelly(maxRadius, length, opts = {}) {
  const {
    peak = 0.45,          // 0..1 position of the bulge along the length
    peakR = 1.0,          // bulge radius, as a fraction of maxRadius
    botR = 0.0,           // radius fraction at the bottom (distal) end
    topR = 0.0,           // radius fraction at the top (proximal) end
    radialSegments = 20,
  } = opts;
  const profile = [
    [botR, 0.0],
    [Math.max(botR, peakR * 0.55), 0.12],
    [Math.max(botR, peakR * 0.85), peak * 0.62],
    [peakR, peak],
    [Math.max(topR, peakR * 0.88), peak + (1 - peak) * 0.32],
    [Math.max(topR, peakR * 0.55), peak + (1 - peak) * 0.66],
    [Math.max(topR, peakR * 0.22), peak + (1 - peak) * 0.9],
    [topR, 1.0],
  ];
  const pts = profile.map(([rf, yf]) =>
    new THREE.Vector2(Math.max(rf * maxRadius, 0.0009), (yf - 0.5) * length));
  return new THREE.LatheGeometry(pts, radialSegments);
}

// A flat, beveled anatomical plaque (fan/wing/kite silhouette) for muscles
// that lie against the torso — built from a 2D outline instead of a
// stretched box or sphere, so it can carry an asymmetric shape (e.g. the
// pec's converging fibers, the lat's V taper).
function extrudeMuscle(points, depth = 0.05, bevelSize = 0.01) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevelSize, bevelSize,
    bevelSegments: 3, curveSegments: 10,
  });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  return geo;
}

function addMuscle(id, geo, pos, rot = [0,0,0], scale = [1,1,1], colorOverride = null) {
  const info = MUSCLE_INFO[id];
  const color = colorOverride || CATEGORIES[info.cat].color;
  const mat = highlightMat(color);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...pos);
  mesh.rotation.set(...rot);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.muscleId = id;
  mesh.userData.baseColor = color;
  bodyGroup.add(mesh);
  muscles.push(mesh);
  return mesh;
}

function mirror(id, geoFactory, pos, rot = [0,0,0], scale = [1,1,1]) {
  [-1, 1].forEach(side => {
    const geo = geoFactory();
    addMuscle(id, geo, [pos[0] * side, pos[1], pos[2]],
      [rot[0], rot[1] * side, rot[2] * side], scale);
  });
}

// Like mirror(), but for asymmetric extruded shapes: also flips the
// geometry itself (not just its position/rotation) so a fan/wing outline
// authored for one side reads as a true mirror image on the other.
function mirrorFlat(id, geoFactory, pos, rot = [0,0,0], scale = [1,1,1]) {
  [-1, 1].forEach(side => {
    const geo = geoFactory();
    if (side === -1) geo.scale(-1, 1, 1);
    addMuscle(id, geo, [pos[0] * side, pos[1], pos[2]],
      [rot[0], rot[1] * side, rot[2] * side], scale);
  });
}

// -- Chest (front): fan of fibers converging toward the sternum, --
// -- widening toward the armpit, rather than a stretched sphere. --
mirrorFlat('chest',
  () => extrudeMuscle([
    [0.00, -0.075], [0.02, -0.105], [0.075, -0.10], [0.125, -0.045],
    [0.14, 0.02], [0.12, 0.075], [0.075, 0.10], [0.02, 0.085], [0.00, 0.055],
  ], 0.05, 0.012),
  [0.02, 1.335, 0.145], [0.1, -0.5, 0.05]);

// -- Lats (back): wide near the armpit, tapering to a point at the --
// -- lower back near the spine — the classic V shape. --
mirrorFlat('lats',
  () => extrudeMuscle([
    [0.01, -0.15], [0.05, -0.09], [0.10, 0.0], [0.155, 0.08],
    [0.175, 0.16], [0.13, 0.14], [0.09, 0.10], [0.03, 0.02], [0.0, -0.09],
  ], 0.045, 0.01),
  [0.03, 1.28, -0.13], [0.05, Math.PI, -0.08]);

// -- Traps (upper back / neckline): a kite/diamond outline — narrow at --
// -- the base of the skull, wide at the shoulders, tapering again --
// -- between the shoulder blades — instead of a 4-sided cone. --
addMuscle('traps',
  extrudeMuscle([
    [0.0, 0.13], [0.115, 0.03], [0.05, -0.11], [0.0, -0.18],
    [-0.05, -0.11], [-0.115, 0.03],
  ], 0.04, 0.01),
  [0, 1.50, -0.1], [0.35, Math.PI, 0]);

// -- Rhomboids (small diamond between traps and lats, near the spine) --
mirrorFlat('rhomboids',
  () => extrudeMuscle([
    [0.0, 0.05], [0.045, 0.01], [0.03, -0.045], [0.0, -0.06], [-0.015, -0.02],
  ], 0.03, 0.008),
  [0.06, 1.37, -0.12], [0.1, Math.PI, 0.15]);

// -- Shoulders / deltoids: rounded cap that tapers down into the arm --
// -- rather than a plain sphere. --
mirror('shoulders',
  () => muscleBelly(0.09, 0.16, { peak: 0.62, topR: 0.45, botR: 0.0, radialSegments: 18 }),
  [0.29, 1.44, 0], [0,0,0.05]);

// -- Biceps, split into long head / short head / brachialis — each a --
// -- tapering belly-into-tendon shape instead of a uniform capsule. --
// Long head: outer (lateral) lobe, closer to the shoulder
mirror('bicepsLongHead',
  () => muscleBelly(0.032, 0.15, { peak: 0.4, radialSegments: 16 }),
  [0.328, 1.315, 0.04], [0, 0, 0.12]);
// Short head: inner (medial) lobe, closer to the shoulder
mirror('bicepsShortHead',
  () => muscleBelly(0.03, 0.15, { peak: 0.38, radialSegments: 16 }),
  [0.305, 1.30, 0.05], [0, 0, 0.12]);
// Brachialis: sits lower/deeper, peeking out on the lateral edge near the elbow
mirror('bicepsBrachialis',
  () => muscleBelly(0.026, 0.1, { peak: 0.32, radialSegments: 14 }),
  [0.325, 1.235, 0.025], [0, 0, 0.12]);

// -- Triceps, split into long / lateral / medial heads --
// Long head: largest, runs medial/upper, toward the shoulder
mirror('tricepsLongHead',
  () => muscleBelly(0.032, 0.18, { peak: 0.58, radialSegments: 16 }),
  [0.293, 1.31, -0.045], [0, 0, 0.12]);
// Lateral head: outer, upper-mid of the back of the arm
mirror('tricepsLateralHead',
  () => muscleBelly(0.028, 0.14, { peak: 0.46, radialSegments: 16 }),
  [0.318, 1.285, -0.03], [0, 0, 0.12]);
// Medial head: deep, small, visible near the elbow
mirror('tricepsMedialHead',
  () => muscleBelly(0.023, 0.09, { peak: 0.35, radialSegments: 14 }),
  [0.302, 1.225, -0.03], [0, 0, 0.12]);

// -- Forearms: fuller mass near the elbow, tapering toward the wrist --
mirror('forearms',
  () => muscleBelly(0.045, 0.21, { peak: 0.72, topR: 0.2, botR: 0.0, radialSegments: 16 }),
  [0.335, 1.00, 0.02], [0.15, 0, 0.1]);

// -- Abs: six segmented rectus-abdominis blocks instead of one plate --
[1.255, 1.16, 1.065].forEach(y => {
  [-0.05, 0.05].forEach(x => {
    addMuscle('abs',
      new RoundedBoxGeometry(0.078, 0.062, 0.045, 4, 0.013),
      [x, y, 0.155], [0, 0, 0]);
  });
});

// -- Obliques --
mirror('obliques',
  () => muscleBelly(0.05, 0.18, { peak: 0.45, radialSegments: 16 }),
  [0.14, 1.14, 0.09], [0, 0, 0.15]);

// -- Lower back / erector spinae (back, either side of spine) --
mirror('lowerback',
  () => muscleBelly(0.035, 0.22, { peak: 0.5, topR: 0.5, botR: 0.4, radialSegments: 14 }),
  [0.045, 1.06, -0.13], [0, 0, 0.04]);

// -- Glutes (back): rounded mound blending into the hip/thigh --
mirror('glutes',
  () => muscleBelly(0.125, 0.2, { peak: 0.55, topR: 0.2, botR: 0.15, radialSegments: 18 }),
  [0.11, 0.92, -0.09], [0,0,0]);

// -- Hip abductors/adductors (outer hip + inner thigh) --
// Outer hip (abductors, e.g. glute medius)
mirror('hipAbductors',
  () => muscleBelly(0.06, 0.12, { peak: 0.5, topR: 0.2, botR: 0.15, radialSegments: 16 }),
  [0.185, 0.83, -0.01], [0,0,0]);
// Inner thigh (adductors)
mirror('hipAbductors',
  () => muscleBelly(0.048, 0.17, { peak: 0.5, topR: 0.2, botR: 0.15, radialSegments: 16 }),
  [0.06, 0.58, 0.01], [0,0,0]);

// -- Quads (front of thigh): fuller mid-thigh mass, blending into hip --
// -- above and the knee below rather than a uniform tube. --
mirror('quads',
  () => muscleBelly(0.085, 0.24, { peak: 0.55, topR: 0.15, botR: 0.1, radialSegments: 18 }),
  [0.115, 0.63, 0.04], [0,0,0]);

// -- Hamstrings (back of thigh) --
mirror('hamstrings',
  () => muscleBelly(0.075, 0.24, { peak: 0.5, topR: 0.15, botR: 0.1, radialSegments: 18 }),
  [0.115, 0.62, -0.04], [0,0,0]);

// -- Calves (back of shin): bulges below the knee, tapers to the --
// -- Achilles near the ankle. --
mirror('calves',
  () => muscleBelly(0.058, 0.2, { peak: 0.62, topR: 0.18, botR: 0.0, radialSegments: 16 }),
  [0.11, 0.26, -0.025], [0,0,0]);

bodyGroup.position.y = -0.05;

// ---------- Category filter state ----------
let activeCategory = 'all';
const DEFAULT_FRAME_TARGET = new THREE.Vector3(0, 1.05, 0);
const DEFAULT_FRAME_DIST = camera.position.distanceTo(controls.target);

function applyCategoryFilter() {
  // Full focus mode: fully hide everything outside the selected group
  // (rather than just dimming it in place) so only that group remains.
  muscles.forEach(mesh => {
    const info = MUSCLE_INFO[mesh.userData.muscleId];
    const inCategory = activeCategory === 'all' || info.cat === activeCategory;
    mesh.visible = inCategory;
  });
  if (selectedMesh && !selectedMesh.visible) clearSelection();
  frameCameraOnCategory(activeCategory);
}

// Auto-frame the camera on whatever is currently visible in the selected
// category, keeping the current viewing angle (front/back/manual rotation).
function frameCameraOnCategory(catKey) {
  if (catKey === 'all') {
    animateCameraFrame(DEFAULT_FRAME_TARGET, DEFAULT_FRAME_DIST);
    return;
  }
  const box = new THREE.Box3();
  let any = false;
  muscles.forEach(mesh => {
    if (mesh.visible) { box.expandByObject(mesh); any = true; }
  });
  if (!any) return;
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 0.05);
  const fov = camera.fov * (Math.PI / 180);
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 2.4; // padding so the group doesn't fill the whole frame
  dist = THREE.MathUtils.clamp(dist, controls.minDistance, controls.maxDistance);
  animateCameraFrame(center, dist);
}

// Smoothly move the orbit target and camera distance while preserving the
// current viewing direction (azimuth/polar angle stay put).
function animateCameraFrame(targetCenter, targetDist) {
  const startTarget = controls.target.clone();
  const startPos = camera.position.clone();
  const startDist = startPos.distanceTo(startTarget) || 1;
  const dir = startPos.clone().sub(startTarget).normalize();
  const startTime = performance.now();
  const duration = 600;
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const curTarget = startTarget.clone().lerp(targetCenter, eased);
    const curDist = startDist + (targetDist - startDist) * eased;
    controls.target.copy(curTarget);
    camera.position.copy(curTarget.clone().add(dir.clone().multiplyScalar(curDist)));
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---------- Category bar UI ----------
const categoryBar = document.getElementById('categoryBar');
Object.entries(CATEGORIES).forEach(([key, def]) => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (key === 'all' ? ' active' : '');
  btn.dataset.cat = key;
  btn.innerHTML = `<span class="dot" style="background:${def.color}"></span>${def.label}`;
  btn.addEventListener('click', () => {
    activeCategory = key;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === key));
    applyCategoryFilter();
  });
  categoryBar.appendChild(btn);
});

// ---------- Front/back view toggle ----------
document.querySelectorAll('#viewToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#viewToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    const dist = camera.position.distanceTo(controls.target);
    const targetAngle = view === 'front' ? 0 : Math.PI;
    animateCameraAngle(targetAngle, dist);
  });
});

function animateCameraAngle(targetAngle, dist) {
  const start = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  const startTime = performance.now();
  const duration = 500;
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const angle = start + (targetAngle - start) * eased;
    camera.position.x = controls.target.x + dist * Math.sin(angle);
    camera.position.z = controls.target.z + dist * Math.cos(angle);
    camera.position.y = controls.target.y + 0.15;
    camera.lookAt(controls.target);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---------- Selection / info panel ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const infoPanel = document.getElementById('infoPanel');
const infoName = document.getElementById('infoName');
const infoCat = document.getElementById('infoCat');
const infoDesc = document.getElementById('infoDesc');
let selectedMesh = null;
const selectEmissive = new THREE.Color(0xffffff);

function clearSelection() {
  if (selectedMesh) {
    selectedMesh.material.emissive.set(0x000000);
  }
  selectedMesh = null;
}

function selectMesh(mesh) {
  clearSelection();
  selectedMesh = mesh;
  mesh.material.emissive.set(0x444444);
  const info = MUSCLE_INFO[mesh.userData.muscleId];
  infoName.textContent = info.name;
  infoCat.textContent = CATEGORIES[info.cat].label;
  infoCat.style.color = CATEGORIES[info.cat].color;
  infoDesc.textContent = info.desc;
  infoPanel.classList.add('show');
}

function onPointerUp(e) {
  const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(muscles.filter(m => m.visible), false);
  if (hits.length) {
    selectMesh(hits[0].object);
  }
}
renderer.domElement.addEventListener('click', onPointerUp);

// ---------- Resize ----------
window.addEventListener('resize', resizeToViewport);

// ---------- Render loop ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

document.getElementById('loading').style.display = 'none';
</script>
